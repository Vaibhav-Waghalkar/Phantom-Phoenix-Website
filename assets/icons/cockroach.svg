<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor">
  <!-- Cockroach Icon -->
  <g>
    <!-- Long Antennae -->
    <path d="M29 16 C25 8 16 4 8 2 C8 4 17 9 27 18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M35 16 C39 8 48 4 56 2 C56 4 47 9 37 18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="32" cy="18" rx="4.5" ry="3.5" />
    <!-- Pronotum (Thorax Shield) -->
    <ellipse cx="32" cy="24" rx="7.5" ry="5" />
    <!-- Abdomen -->
    <path d="M25 28 C25 28 24 44 32 49 C40 44 39 28 39 28 Z" />
    <!-- Wing lines -->
    <line x1="32" y1="28" x2="32" y2="48" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <!-- Cerci at tail -->
    <path d="M30 48 L27 54 M34 48 L37 54" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Legs Left -->
    <path d="M26 23 L18 19 L12 21" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M25 32 L16 33 L10 39" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M26 40 L16 44 L11 53" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Legs Right -->
    <path d="M38 23 L46 19 L52 21" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M39 32 L48 33 L54 39" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M38 40 L48 44 L53 53" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
