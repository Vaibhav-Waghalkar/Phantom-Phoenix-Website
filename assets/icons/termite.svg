<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor">
  <!-- Termite Icon (Soldier/Worker ant-like with distinct straight antennae and jaws) -->
  <g>
    <!-- Straight Beaded Antennae -->
    <path d="M28 17 C25 12 21 8 16 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M36 17 C39 12 43 8 48 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Mandibles / Jaws -->
    <path d="M29 16 C30 11 31 9 32 8 C33 9 34 11 35 16" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <!-- Head -->
    <ellipse cx="32" cy="19" rx="5" ry="4.5" />
    <!-- Thorax -->
    <ellipse cx="32" cy="27" rx="4" ry="3.5" />
    <!-- Broad Waist and Oval Abdomen -->
    <ellipse cx="32" cy="40" rx="8" ry="11" />
    <!-- Abdomen segments -->
    <path d="M25 35 Q32 37 39 35 M24 40 Q32 42 40 40 M26 45 Q32 47 38 45" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.3"/>
    <!-- Legs Left -->
    <path d="M28 25 L20 22 L14 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M28 29 L18 31 L12 36" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M27 34 L18 38 L14 47" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Legs Right -->
    <path d="M36 25 L44 22 L50 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M36 29 L46 31 L52 36" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M37 34 L46 38 L50 47" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
